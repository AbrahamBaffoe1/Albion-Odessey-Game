services:
  - type: web
    name: albion-odyssey-online
    runtime: node
    plan: free
    branch: fauna-remote
    rootDir: Backend/Realtime
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: SMTP_FROM
        value: abraham@nexoralab.net
      - key: SMTP_USER
        value: abraham@nexoralab.net
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SEND_EMAIL_HOOK_SECRET
        sync: false
