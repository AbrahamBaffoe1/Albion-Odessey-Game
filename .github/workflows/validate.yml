name: Rules and asset validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test core rules with sanitizers and validate assets
        run: bash Tools/test.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Test Unity economy and exported meshes
        run: |
          dotnet run --project Tests/UnityRules/Rules.csproj
          python3 Tools/validate_unity_geometry.py
